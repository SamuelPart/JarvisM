[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvism"
version = "0.1.0"
description = "JarvisM - asistente/agente de voz multiplataforma con gobernanza de acciones y proactividad"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SamuelPart" }]
keywords = ["assistant", "agent", "voice", "llm", "automation", "cross-platform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: System :: Systems Administration",
]

# Núcleo: lo mínimo e innegociable. Todo lo pesado es opcional (principio P5, ADR-0001).
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "jsonschema>=4.21",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
]
ui = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "websockets>=12.0",
]
local = [
  "ollama>=0.3",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "types-jsonschema",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.urls]
Homepage = "https://github.com/SamuelPart/JarvisM"
Issues = "https://github.com/SamuelPart/JarvisM/issues"

[tool.setuptools.packages.find]
include = ["jarvis*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
jarvis = ["py.typed", "resources/*.toml"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
  "B008",   # llamadas a funciones en defaults de argumentos (patrón Typer)
  "ARG002", # args sin usar en métodos de interfaz
  "SIM108", # ternarios: a veces el if es más legible
]

[tool.ruff.lint.per-file-ignores]
# En tests, los fixtures se piden por su EFECTO (aislar HOME, preparar datos) y
# no siempre se usan en el cuerpo: ARG001 sería ruido constante.
"tests/*" = ["S101", "ARG001"]
"jarvis/platforms/*.py" = ["PTH"]
# Los skills declaran su JSON Schema y sus plataformas como atributos de clase
# (metadatos declarativos, nunca se mutan). Es el patrón de diseño del catálogo,
# no un descuido: no tiene sentido envolverlo en ClassVar en 28 subclases.
"jarvis/skills/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["jarvis.core.*", "jarvis.safety.*"]
disallow_untyped_defs = true

# El catálogo de skills usa un patrón de plugin: la clase base declara
# `execute(**kwargs)` y cada skill lo especializa con su firma real y tipada
# (que es lo deseable). mypy marca eso como Liskov violado; aquí es intencional,
# porque la validación de argumentos la hace el JSON Schema antes de ejecutar.
[[tool.mypy.overrides]]
module = ["jarvis.skills.*"]
disable_error_code = ["override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: tests que tocan el sistema real o la red",
  "slow: tests lentos",
  "voice: requieren dispositivos de audio",
]

[tool.coverage.run]
source = ["jarvis"]
omit = ["jarvis/voice/*", "jarvis/server/*", "jarvis/ui/*"]
