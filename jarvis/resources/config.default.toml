# ===========================================================================
# JarvisM - configuración por defecto (versionada, se distribuye con el paquete)
#
# Orden de precedencia (de menos a más prioridad):
#   1. este archivo
#   2. ~/.config/jarvis/config.toml        (tu configuración personal)
#   3. ./jarvis.toml                       (config por proyecto/carpeta)
#   4. variables de entorno  JARVIS__SECCION__CLAVE
#   5. flags de la CLI
#
# NO edites este archivo para tu configuración personal: crea el de ~/.config.
# ===========================================================================

[identity]
name = "Jarvis"
language = "es"
# Tono: formal (JARVIS de Iron Man) | neutro | cercano | terse
tone = "formal"
verbosity = "normal"        # terse | normal | detailed
wake_words = ["jarvis", "jarvis m", "oye jarvis"]

[router]
# Cadena de failover: se prueba en orden hasta encontrar uno sano con clave.
default_chain = ["gemini", "anthropic", "openai", "ollama"]
profile = "general"          # cheap | general | reasoner | vision | offline
max_steps_per_turn = 6       # tope duro del bucle agéntico (ADR-0003)
timeout_s = 30.0
max_retries = 2
backoff_base_s = 0.8
max_rpm = 12                 # protege del 429 del free tier
health_cache_s = 60
circuit_breaker_failures = 3
circuit_breaker_cooldown_s = 300
# Perfiles lógicos -> modelo concreto. Cámbialos cuando cambien los releases.
model_cheap = "gemini-2.5-flash-lite"
model_general = "gemini-3.7-flash"
model_reasoner = "claude-sonnet-5"
model_vision = "gemini-3.1-pro"
model_offline = "qwen2.5:7b-instruct"
# N0 de la cascada: resolver sin gastar tokens cuando la intención es inequívoca.
local_matcher_enabled = true
local_matcher_min_confidence = 0.86
semantic_cache_enabled = false
semantic_cache_ttl_s = 45

# Modelo concreto a usar cuando el failover salta a otro proveedor.
# (Las tablas anidadas van al final de su sección, si no TOML las absorbe.)
[router.fallback_models]
openai = "gpt-5.6-luna"
anthropic = "claude-haiku-4-5"
gemini = "gemini-3.7-flash"
ollama = "qwen2.5:7b-instruct"
echo = "echo-local"

[budget]
usd_per_day = 0.50
tokens_per_day = 2000000
actions_per_hour = 120
warn_at_pct = 80
hard_stop = true

[providers.openai]
enabled = true
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
enabled = true
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
anthropic_version = "2023-06-01"

[providers.gemini]
enabled = true
base_url = "https://generativelanguage.googleapis.com"
api_key_env = "GEMINI_API_KEY"

[providers.ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
api_key_env = ""             # no necesita clave

[memory]
max_turns_in_context = 24
max_context_tokens = 6000
summarize_on_overflow = true
persist_sessions = true

[privacy]
offline = false              # true = cero red: Ollama + STT/TTS locales
redact_secrets = true        # enmascara claves/tokens antes de enviar o persistir
store_transcripts = true
# Rutas que NUNCA se leen ni se indexan, pase lo que pase.
exclude_paths = [
  "~/.ssh",
  "~/.gnupg",
  "~/.aws/credentials",
  "~/.config/gcloud",
  "/etc/shadow",
]

[policy]
# Tier mínimo exigido para ejecutar sin confirmación: T0 y T1 auto, T2+ piden aprobación.
auto_approve_max_tier = "T1"
approval_timeout_s = 60
require_typed_confirmation_for_t3 = true
# Raíces donde escribir es T1. Fuera de ellas, la escritura sube de tier.
jail_roots = ["~/JarvisWorkspace", "~/Documents/Jarvis", "/tmp/jarvis"]
# Binarios que shell.run puede proponer sin allowlist adicional (siguen siendo T3).
shell_allowlist = [
  "ls", "pwd", "cat", "head", "tail", "grep", "find", "du", "df", "ps", "top",
  "free", "uptime", "date", "whoami", "hostname", "uname", "which", "echo",
  "git", "python3", "pip", "node", "npm", "docker",
]
shell_timeout_s = 20
shell_max_output_bytes = 20000
# En Kali: todo lo ofensivo queda T3 y requiere allowlist explícita del usuario.
restricted_binaries = [
  "sudo", "su", "doas", "pkexec", "nmap", "hydra", "sqlmap", "john", "hashcat",
  "aircrack-ng", "msfconsole", "metasploit", "burpsuite", "nikto", "gobuster",
  "netcat", "nc", "tcpdump", "wireshark", "iptables", "ufw", "shutdown",
  "reboot", "poweroff", "halt", "mkfs", "dd", "shred", "fdisk", "parted",
]

[watchdog]
enabled = true
interval_s = 30
disk_warn_pct = 85
disk_crit_pct = 93
ram_warn_pct = 85
ram_crit_pct = 95
swap_warn_pct = 60
load_warn_factor = 1.5       # x nº de núcleos
temp_warn_c = 78
temp_crit_c = 90
battery_low_pct = 20
cooldown_s = 21600           # 6 h entre sugerencias repetidas del mismo monitor
quiet_hours = ["23:30-07:30"]
speak_high_severity = false  # solo notifica; la voz llega en Fase 3

[voice]
enabled = false              # se activa en Fase 3
stt_mode = "local"           # local | cloud
stt_model = "small"          # base | small | medium | large-v3
stt_language = "es"
tts_engine = "piper"         # piper | edge-tts | openai | espeak-ng
tts_voice = "es_ES-davefx-medium"
wake_word_engine = "openwakeword"
wake_word_threshold = 0.6
sample_rate = 16000
vad_threshold = 0.5
silence_ms = 700
barge_in = true

[server]
enabled = false
host = "127.0.0.1"           # NUNCA 0.0.0.0 sin token y razón justificada
port = 8765
require_token = true
cors_origins = []

[ui]
theme = "dark"
show_cost = true
show_tier_badges = true
spinner = "dots"

[logging]
level = "INFO"
file_enabled = true
max_bytes = 5242880
backups = 3
