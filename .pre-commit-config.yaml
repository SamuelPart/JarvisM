# Hooks de pre-commit: lo que no pase aquí, no llega a main.
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
default_language_version:
  python: python3

repos:
  # --- Higiene básica ------------------------------------------------------- #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # --- Secretos ------------------------------------------------------------- #
  # Regla permanente del proyecto: una clave colada en un commit es un incidente.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (detector de secretos)
        args: ["--no-banner", "--redact"]

  # --- Estilo, lint y tipos ------------------------------------------------- #
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (core, safety, skills)
        args: ["--config-file=pyproject.toml"]
        files: ^jarvis/(core|safety|skills|config|providers|platforms)/
        additional_dependencies: ["pydantic>=2.7", "types-jsonschema", "httpx"]

  # --- Tests rápidos -------------------------------------------------------- #
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (sin los marcados como slow/integration)
        entry: python -m pytest -q -m "not slow and not integration"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: arch-invariants
        name: invariantes de arquitectura (subprocess, exec, secretos)
        entry: python -m pytest -q tests/test_architecture.py
        language: system
        pass_filenames: false
        files: ^jarvis/
