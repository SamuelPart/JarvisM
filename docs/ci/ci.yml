# =============================================================================
# JarvisM · pipeline de integración continua
#
# PARA QUÉ SIRVE
#   - Tests en matriz de 3 sistemas operativos (Linux, macOS, Windows) y 3
#     versiones de Python: el requisito del proyecto es funcionar en los tres.
#   - Job de invariantes de seguridad: si el policy engine o los tests de
#     arquitectura fallan, el pipeline se cae y no se publica (docs/03 §7).
#   - Instalación limpia usando los scripts reales de scripts/: valida que el
#     instalador funciona en una máquina vacía, no solo en la del autor.
#
# CÓMO INSTALARLO
#   # Con permisos de `workflow` en el repositorio (los que otorga el dueño,
#   # no un token de app restringido):
#   mkdir -p .github/workflows
#   cp docs/ci/ci.yml .github/workflows/ci.yml
#   git add .github/workflows/ci.yml
#   git commit -m "ci: activar el pipeline"
#   git push
#
#   Por SSH, en lugar de HTTPS, si tu token no tiene el scope `workflow`:
#   gh auth refresh -h github.com -s workflow
#
# NOTA
#   Este archivo se guarda fuera de .github/workflows a propósito: algunas
#   integraciones (GitHub Apps) no tienen permiso para crear ficheros de
#   workflow, y se perdería el contenido. Al copiarlo queda activo sin cambios.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Ningún test debe tocar la red ni las claves del repositorio.
  JARVIS__PRIVACY__OFFLINE: "true"
  JARVIS__LOG_LEVEL: "WARNING"

jobs:
  # ------------------------------------------------------------------------- #
  # Matriz de sistemas operativos: el requisito es funcionar en los tres.
  # ------------------------------------------------------------------------- #
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar JarvisM y dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tipos (mypy)
        run: mypy jarvis

      - name: Tests
        run: pytest -q --cov=jarvis --cov-report=term-missing --cov-fail-under=60

      - name: Smoke test de la CLI
        run: |
          jarvis version
          jarvis doctor --json
          jarvis skills --json
          jarvis bench
          jarvis audit --verify

  # ------------------------------------------------------------------------- #
  # Invariantes de seguridad: si esto falla, no se publica.
  # ------------------------------------------------------------------------- #
  security-invariants:
    name: invariantes de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Policy engine y arquitectura
        run: pytest -q tests/test_policy.py tests/test_architecture.py -v
      - name: Ningún T3 se ejecuta sin aprobación
        run: pytest -q tests/test_policy.py -k "denylist or held_for_any or approve"
      - name: Detector de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------- #
  # Instalación desde cero: valida los scripts de instalación de verdad.
  # ------------------------------------------------------------------------- #
  clean-install:
    name: instalación limpia · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar el instalador del SO
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/install-kali.sh --no-system --dev
      - name: Ejecutar el instalador del SO
        if: matrix.os == 'macos-latest'
        run: ./scripts/install-macos.sh --no-system --dev
      - name: Verificación post-instalación
        run: |
          source .venv/bin/activate
          jarvis version
          jarvis doctor
          jarvis chat --once "¿qué hora es?"

  clean-install-windows:
    name: instalación limpia · windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar el instalador de Windows
        shell: pwsh
        run: ./scripts/install-windows.ps1 -NoSystem -Dev
      - name: Verificación post-instalación
        shell: pwsh
        run: |
          & .venv\Scripts\jarvis.exe version
          & .venv\Scripts\jarvis.exe doctor
