# ---------------------------------------------------------------------------
# JarvisM Pro — propiedades de Gradle
# ---------------------------------------------------------------------------

# Memoria para el daemon. 2 GB es suficiente para un módulo de este tamaño y
# evita el "OutOfMemoryError: Metaspace" en máquinas con poca RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX es obligatorio (Jetpack Compose no funciona sin él).
android.useAndroidX=true

# Clases R por módulo: compila más rápido y evita colisiones de recursos.
android.nonTransitiveRClass=true

# Kotlin: estilo oficial y paralelismo del daemon.
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true

# Si tu equipo va justo de RAM, deja solo un worker.
org.gradle.workers.max=4
