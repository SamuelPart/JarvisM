<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#00f0ff; --cyan-soft:#8ff4ff; --cyan-dim:#1e4a5c; --text-dim:#3a6a7c;
  --ok:#46ffb1; --warn:#ffc84d; --bad:#ff5c5c; --panel:rgba(4,10,14,.78);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:#000; color:var(--cyan); font-family:'Orbitron','Consolas',monospace;
  overflow:hidden; height:100vh; position:relative;
  background-image:
    linear-gradient(rgba(0,240,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,.045) 1px, transparent 1px),
    linear-gradient(rgba(0,240,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,.018) 1px, transparent 1px),
    radial-gradient(ellipse 60% 55% at 50% 46%, rgba(0,70,110,.32), transparent 68%),
    radial-gradient(ellipse 130% 110% at 50% 50%, transparent 46%, rgba(0,0,0,.82) 100%);
  background-size:140px 140px, 140px 140px, 28px 28px, 28px 28px, 100% 100%, 100% 100%;
}
.scanline{position:fixed; inset:0; pointer-events:none; z-index:30;
  background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,240,255,.025) 3px 4px);}
.vignette{position:fixed; inset:0; pointer-events:none; z-index:29;
  background:radial-gradient(ellipse 75% 75% at 50% 48%, transparent 55%, rgba(0,0,0,.78) 100%);}

/* ── top-right: reloj + estado + expression box ───────────────────── */
.topright{position:fixed; top:14px; right:26px; z-index:20; text-align:right; user-select:none;}
.clock{font-size:21px; font-weight:500; letter-spacing:.32em; color:#c9f6ff;
  text-shadow:0 0 14px rgba(0,240,255,.6); font-variant-numeric:tabular-nums;}
.sysline{margin-top:5px; font-size:8.5px; letter-spacing:.34em; color:#b9f2ff; opacity:.9;}
.stateline{margin-top:2px; font-size:13px; letter-spacing:.5em; text-indent:.5em; color:#d8fbff;
  text-shadow:0 0 12px rgba(0,240,255,.7);}
.stateline.warn{color:var(--warn); text-shadow:0 0 14px rgba(255,200,77,.7);}
.stateline.bad{color:var(--bad); text-shadow:0 0 14px rgba(255,92,92,.7);}
.expression{margin:16px 0 0 auto; text-align:left; width:158px;}
.expression .lbl{font-size:7px; letter-spacing:.34em; color:var(--text-dim); margin-bottom:2px; display:flex; justify-content:space-between;}
.expr-box{border:1px solid rgba(140,240,255,.28); background:rgba(3,12,16,.82); box-shadow:0 0 16px rgba(0,240,255,.06), inset 0 0 14px rgba(0,240,255,.05);}
.expr-row{display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 9px; font-size:9px; letter-spacing:.3em; color:#9be9f5; border-bottom:1px solid rgba(140,240,255,.12); cursor:pointer; transition:all .25s;}
.expr-row:last-child{border-bottom:none;}
.expr-row svg{flex:0 0 auto;}
.expr-row:hover{color:#eafcff; background:rgba(0,240,255,.07);}
.expr-row.active{color:#eafcff; background:rgba(0,240,255,.12); box-shadow:inset 3px 0 0 var(--cyan); text-shadow:0 0 10px rgba(0,240,255,.8);}

/* ── top-left: diagnósticos reales, discretos ─────────────────────── */
.diag{position:fixed; top:14px; left:26px; z-index:20; user-select:none; width:215px;}
.diag .lbl{font-size:7px; letter-spacing:.34em; color:var(--text-dim); border-bottom:1px solid rgba(140,240,255,.14); padding-bottom:4px; margin-bottom:7px; display:flex; justify-content:space-between;}
.diag-row{display:flex; justify-content:space-between; align-items:baseline; font-size:8px; letter-spacing:.14em; padding:2.6px 0; color:#6fb6c9;}
.diag-row b{color:#d5f9ff; font-weight:500; font-variant-numeric:tabular-nums; text-shadow:0 0 8px rgba(0,240,255,.45);}
.diag-row b.ok{color:var(--ok);} .diag-row b.warn{color:var(--warn);} .diag-row b.bad{color:var(--bad);}

/* ── núcleo central ───────────────────────────────────────────────── */
.core-stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:10;}
#reactorWrap{will-change:filter; transition:filter .6s;}
.ring-a{animation:spin 16s linear infinite; transform-origin:150px 150px;}
.ring-b{animation:spin-rev 30s linear infinite; transform-origin:150px 150px;}
.ring-c{animation:spin-rev 42s linear infinite; transform-origin:150px 150px;}
.ring-d{animation:spin 22s linear infinite; transform-origin:150px 150px;}
.ring-e{animation:spin 7.5s linear infinite; transform-origin:150px 150px;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes spin-rev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}
@keyframes corePulse{0%,100%{opacity:.75;}50%{opacity:1;}}
.core-pulse{animation:corePulse 3.1s ease-in-out infinite;}
@keyframes particleDrift{0%,100%{opacity:.15; transform:translate(0,0) scale(.8);}50%{opacity:.9; transform:translate(var(--dx),var(--dy)) scale(1.15);}}
.particle{animation:particleDrift var(--dur) ease-in-out infinite; animation-delay:var(--delay);}
#jarvisText{fill:#d9fbff; letter-spacing:.42em; font-weight:700; font-size:14.5px;
  text-shadow:0 0 18px rgba(0,240,255,.95);}

/* ── esquinas inferiores ──────────────────────────────────────────── */
.corner{position:fixed; bottom:16px; z-index:20; font-size:8px; letter-spacing:.3em; color:#2c5a6c; user-select:none;}
.corner b{color:#7fd8e8; font-weight:500;}
.corner .sep{margin:0 10px; color:#173845;}
.bottomleft{left:26px;} .bottomright{right:26px; text-align:right;}

/* ── foco (Modo F.O.C.U.S.) ───────────────────────────────────────── */
body.focus .diag, body.focus .corner, body.focus .topright .expression{opacity:.07; filter:blur(.4px); transition:opacity .5s;}
body.focus .topright .clock, body.focus .topright .sysline, body.focus .topright .stateline{opacity:.32; transition:opacity .5s;}

@media (max-width: 900px){
  .diag{display:none;} .corner{letter-spacing:.18em;}
}
@media (max-width: 640px){
  .expression{display:none;} .corner{display:none;}
  .clock{font-size:16px;}
}
</style>
</head>
<body>
<div class="vignette"></div>
<div class="scanline"></div>

<!-- top-left · diagnósticos reales -->
<div class="diag" aria-hidden="true">
  <div class="lbl">SYSTEM // DIAGNOSTICS <span>LIVE</span></div>
  <div class="diag-row"><span>HEALTH</span><b id="dHealth">—</b></div>
  <div class="diag-row"><span>CPU</span><b id="dCpu">—</b></div>
  <div class="diag-row"><span>MEMORY</span><b id="dRam">—</b></div>
  <div class="diag-row"><span>SWAP</span><b id="dSwap">—</b></div>
  <div class="diag-row"><span>DISK FREE</span><b id="dDisk">—</b></div>
  <div class="diag-row"><span>NET ↓ / ↑</span><b id="dNet">—</b></div>
  <div class="diag-row"><span>POWER</span><b id="dPower">—</b></div>
  <div class="diag-row"><span>UPTIME</span><b id="dUptime">—</b></div>
  <div class="diag-row"><span>PROCESSES</span><b id="dProc">—</b></div>
</div>

<!-- top-right · reloj, estado y expression (layout de la referencia) -->
<div class="topright">
  <div class="clock" id="timeLine">--:--:--</div>
  <div class="sysline" id="sysLine">ALL SYSTEMS NORMAL</div>
  <div class="stateline" id="stateLine">IDLE</div>
  <div class="expression">
    <div class="lbl">EXPRESSION<span>06</span></div>
    <div class="expr-box">
      <div class="expr-row active" id="exprJarvis" role="button" tabindex="0">
        <span>J.A.R.V.I.S</span>
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 10 5 5 10 0 5Z" fill="#00f0ff"/></svg>
      </div>
      <div class="expr-row" id="exprFocus" role="button" tabindex="0"><span>F.O.C.U.S.</span></div>
    </div>
  </div>
</div>

<!-- núcleo central -->
<div class="core-stage">
  <div id="reactorWrap">
    <svg id="reactorSvg" width="min(64vmin, 540px)" height="min(64vmin, 540px)" viewBox="0 0 300 300" role="img" aria-label="Núcleo JARVIS">
      <defs>
        <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#123a4e"/>
          <stop offset="34%" stop-color="#0a2433"/>
          <stop offset="75%" stop-color="#041420"/>
          <stop offset="100%" stop-color="#010a10"/>
        </radialGradient>
        <radialGradient id="innerPhoton" cx="50%" cy="42%" r="58%">
          <stop offset="0%" stop-color="#8ff4ff" stop-opacity=".5"/>
          <stop offset="55%" stop-color="#0af0ff" stop-opacity=".08"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
        <linearGradient id="arcCyan" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#00f0ff"/>
          <stop offset=".5" stop-color="#19c8e8"/>
          <stop offset="1" stop-color="#00f0ff"/>
        </linearGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="3.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowBig" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- anillo ambiental más exterior -->
      <circle cx="150" cy="150" r="146" fill="none" stroke="rgba(0,240,255,.05)" stroke-width="20"/>
      <circle cx="150" cy="150" r="144.5" fill="none" stroke="rgba(140,240,255,.16)" stroke-width="1" stroke-dasharray="1 9"/>

      <!-- anillo de marcas (ticks) -->
      <g class="ring-c" opacity=".85">
        <circle cx="150" cy="150" r="128" fill="none" stroke="#35e0f4" stroke-width="7.5"
                stroke-dasharray="1.6 3.75" stroke-linecap="butt"/>
      </g>
      <g class="ring-d" opacity=".4">
        <circle cx="150" cy="150" r="112" fill="none" stroke="#00f0ff" stroke-width="1.6"
                stroke-dasharray="58 12 240 12 70 12"/>
      </g>

      <!-- arcos gruesos translúcidos principales -->
      <g class="ring-b" filter="url(#glow)">
        <circle cx="150" cy="150" r="92" fill="none" stroke="url(#arcCyan)" stroke-opacity=".5"
                stroke-width="26" stroke-linecap="round"
                stroke-dasharray="104 40 152 34 88 46"/>
      </g>
      <!-- arco amarillo superior (firma de la referencia) -->
      <g class="ring-a" filter="url(#glow)">
        <circle cx="150" cy="150" r="105" fill="none" stroke="#ffd54a" stroke-opacity=".95"
                stroke-width="3.2" stroke-linecap="round" stroke-dasharray="96 622"
                transform="rotate(-97 150 150)"/>
      </g>
      <!-- segmentos azul eléctrico exteriores -->
      <g class="ring-a" opacity=".8" filter="url(#glow)">
        <circle cx="150" cy="150" r="135" fill="none" stroke="#2f7bff" stroke-width="2.6"
                stroke-dasharray="30 120 12 200 46 90"/>
        <circle cx="150" cy="150" r="76" fill="none" stroke="#5fd8ff" stroke-width="2"
                stroke-dasharray="64 40 10 220 28 60"/>
      </g>
      <!-- arco de salud (real) -->
      <circle id="healthArc" cx="150" cy="150" r="59" fill="none" stroke="#46ffb1" stroke-width="2.6"
              stroke-linecap="round" stroke-dasharray="370.7" stroke-dashoffset="370.7"
              opacity=".9" filter="url(#glow)" transform="rotate(-90 150 150)"
              style="transition:stroke-dashoffset 1s ease, stroke .6s;"/>

      <!-- anillo interno discontinuo -->
      <g class="ring-e" opacity=".9">
        <circle cx="150" cy="150" r="48.5" fill="none" stroke="#59e6f7" stroke-width="3"
                stroke-dasharray="2.2 5.2"/>
      </g>

      <!-- núcleo -->
      <circle cx="150" cy="150" r="45" fill="url(#coreGrad)"/>
      <circle cx="150" cy="150" r="45" fill="url(#innerPhoton)" class="core-pulse"/>
      <circle cx="150" cy="150" r="45" fill="none" stroke="rgba(150,250,255,.4)" stroke-width="1.1"/>
      <circle cx="150" cy="150" r="33" fill="none" stroke="rgba(120,235,255,.14)" stroke-width="1"/>
      <circle cx="150" cy="150" r="21" fill="none" stroke="rgba(120,235,255,.18)" stroke-width=".7" stroke-dasharray="2 4"/>

      <!-- partículas (bokeh cian estilo referencia) -->
      <g fill="#aefcff" filter="url(#glow)">
        <circle class="particle" style="--dx:4px; --dy:-7px; --dur:4.6s; --delay:-.6s"  cx="128" cy="132" r="1.5" opacity=".8"/>
        <circle class="particle" style="--dx:-6px; --dy:5px; --dur:5.4s; --delay:-2.1s" cx="166" cy="120" r="1.1" opacity=".7"/>
        <circle class="particle" style="--dx:5px; --dy:6px; --dur:3.9s; --delay:-1.4s" cx="176" cy="158" r="1.8" opacity=".8"/>
        <circle class="particle" style="--dx:-4px; --dy:-5px; --dur:6.1s; --delay:-3.2s" cx="132" cy="166" r="1.2" opacity=".6"/>
        <circle class="particle" style="--dx:6px; --dy:-3px; --dur:4.1s; --delay:-.2s"  cx="152" cy="141" r=".9"  opacity=".9"/>
        <circle class="particle" style="--dx:-5px; --dy:-6px; --dur:5.8s; --delay:-4.1s" cx="141" cy="122" r="1"   opacity=".55"/>
      </g>

      <!-- marca central -->
      <text id="jarvisText" x="152" y="153.5" text-anchor="middle" dominant-baseline="middle">J.A.R.V.I.S</text>
    </svg>
  </div>
</div>

<!-- esquinas inferiores con datos reales -->
<div class="corner bottomleft">STATE <b id="stateLabel">IDLE</b><span class="sep">·</span>PANELS <b id="panelLabel">ALL</b><span class="sep">·</span>CORE <b id="coreLabel">0%</b></div>
<div class="corner bottomright">MODE <b id="modeLabel">AUTO</b><span class="sep">·</span>DATA FLOW <b id="dataFlowLabel">1.0Hz</b><span class="sep">·</span>TEMP <b id="tempLabel">N/D</b></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const HEALTH_CIRC = 370.7;
let lastTickAt = 0, pollHz = 1.0;

function setText(id, value){ const el = $(id); if (el) el.textContent = value; }
function padTime(d){ return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':'); }
function fmtUptime(sec){
  const days = Math.floor(sec / 86400), rem = sec % 86400;
  const h = String(Math.floor(rem / 3600)).padStart(2, '0');
  const m = String(Math.floor((rem % 3600) / 60)).padStart(2, '0');
  const s = String(rem % 60).padStart(2, '0');
  return `${days}D ${h}:${m}:${s}`;
}
function healthTone(h){ return h >= 70 ? '' : (h >= 40 ? 'warn' : 'bad'); }
function cpuState(cpu){ return cpu < 25 ? 'IDLE' : (cpu < 60 ? 'ACTIVE' : 'BUSY'); }

function render(d){
  const now = new Date();
  setText('timeLine', padTime(now));
  const health = d.health, cpu = d.cpu_percent;
  const tone = healthTone(health);
  // Estado superior derecho (estilo referencia)
  setText('sysLine', health >= 70 ? 'ALL SYSTEMS NORMAL' : (health >= 40 ? 'SYSTEMS UNDER LOAD' : 'SYSTEM ALERT'));
  const stateEl = $('stateLine');
  stateEl.textContent = cpuState(cpu);
  stateEl.className = 'stateline' + (tone ? ' ' + tone : '');
  // Diagnósticos top-left
  const setVal = (id, value, cls) => { const el = $(id); el.textContent = value; el.className = cls || ''; };
  setVal('dHealth', health.toFixed(0) + '%', health >= 70 ? 'ok' : (health >= 40 ? 'warn' : 'bad'));
  setVal('dCpu', cpu.toFixed(1) + '%');
  setVal('dRam', `${d.ram.used_gb}/${d.ram.total_gb} GB · ${d.ram.percent.toFixed(0)}%`);
  setVal('dSwap', d.swap.percent.toFixed(0) + '%');
  setVal('dDisk', d.disk.free_gb + ' GB (' + (100 - d.disk.percent).toFixed(0) + '% LIBRE)');
  setVal('dNet', `${d.net.down_mbps.toFixed(2)}↓ ${d.net.up_mbps.toFixed(2)}↑ Mb/s`);
  setVal('dPower', d.battery.percent == null ? 'AC · EXTERNA' : `${d.battery.percent}%${d.battery.plugged ? ' · ENCHUFADO' : ' · BATERÍA'}`);
  setVal('dUptime', fmtUptime(d.uptime_seconds));
  setVal('dProc', d.processes);
  // Esquinas inferiores
  setText('stateLabel', cpuState(cpu));
  setText('coreLabel', cpu.toFixed(0) + '%');
  setText('modeLabel', health >= 40 ? 'AUTO' : 'ALERT');
  setText('dataFlowLabel', pollHz.toFixed(1) + 'Hz');
  setText('tempLabel', d.environment.cpu_temp_c == null ? 'N/D' : d.environment.cpu_temp_c.toFixed(1) + '°C');
  // Arco de salud + reacción del núcleo a la carga
  const arc = $('healthArc');
  arc.style.strokeDashoffset = String(HEALTH_CIRC * (1 - Math.max(0, Math.min(100, health)) / 100));
  arc.style.stroke = health >= 70 ? '#46ffb1' : (health >= 40 ? '#ffc84d' : '#ff5c5c');
  $('reactorWrap').style.filter = `drop-shadow(0 0 ${10 + cpu * 0.42}px rgba(0,240,255,${0.42 + Math.min(0.4, cpu * 0.006)}))`;
  const ringA = document.querySelector('.ring-a');
  if (ringA) ringA.style.animationDuration = (16 - Math.min(10, cpu * 0.1)).toFixed(2) + 's';
}
function offline(){
  setText('sysLine', 'LINK LOST');
  const stateEl = $('stateLine'); stateEl.textContent = 'OFFLINE'; stateEl.className = 'stateline bad';
}
async function tick(){
  const started = performance.now();
  try {
    const response = await fetch('/api/stats', {cache: 'no-store'});
    if (!response.ok) throw new Error('bad status');
    const data = await response.json();
    if (lastTickAt){ pollHz = 1000 / (started - lastTickAt); pollHz = Math.min(9.9, Math.max(0.1, pollHz)); }
    lastTickAt = started;
    render(data);
  } catch (error) { offline(); }
}
// Módo F.O.C.U.S. (el núcleo sobrevive a todo lo demás)
function setFocus(on){
  document.body.classList.toggle('focus', on);
  $('exprFocus').classList.toggle('active', on);
  $('exprJarvis').classList.toggle('active', !on);
}
$('exprFocus').addEventListener('click', () => setFocus(true));
$('exprJarvis').addEventListener('click', () => setFocus(false));
$('exprFocus').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setFocus(true);} });
$('exprJarvis').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setFocus(false);} });

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
